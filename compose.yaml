# gb10-assets server. Settings come from .env next to this file (copy .env.example or run scripts/docker.sh init).
#   docker compose up -d           start (builds the image if it is not there yet)
services:
  server:
    image: ${GB10_ASSETS_IMAGE:-stefanmenne/gb10-assets}:${GB10_ASSETS_TAG:-latest}
    build: .
    restart: unless-stopped
    # run as the host user so downloaded weights and job files are not owned by root
    user: "${GB10_UID:-1000}:${GB10_GID:-1000}"
    ports:
      - "${GB10_ASSETS_PORT:-8750}:8750"
    environment:
      GB10_ASSETS_TOKEN: ${GB10_ASSETS_TOKEN:?set GB10_ASSETS_TOKEN in .env (scripts/docker.sh init creates one)}
      HF_TOKEN: ${HF_TOKEN:-}
      WORKER_IDLE_S: ${WORKER_IDLE_S:-0}
      MEMORY_WAIT_S: ${MEMORY_WAIT_S:-600}
      WORKER_READY_S: ${WORKER_READY_S:-1800}
      JOB_TTL_H: ${JOB_TTL_H:-24}
    volumes:
      # relative paths are resolved against this directory
      - ${MODELS_DIR:-./models}:/models
      - ${JOBS_DIR:-./jobs}:/jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
