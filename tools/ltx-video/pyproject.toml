[project]
name = "gb10-tool-ltx-video"
version = "0.1.0"
description = "LTX-2.5 (NVFP4 distilled) worker for gb10-assets: text/image/audio to video and video retakes"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch 2.14 headers need C++20, ltx-kernels (NVFP4 GEMM, built by build_kernels.sh) compiles with C++17
    "torch==2.13.0",
    "torchvision==0.28.0",
    # newest cu132 build; ltx-core only uses its pure-Python MelSpectrogram and resample
    "torchaudio==2.11.0",
    "ltx-core",
    "ltx-pipelines",
    "triton>=3.0",
    "pillow>=11",
]

[tool.uv]
package = false
# GB10 only: aarch64, CUDA 13
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

# the same indexes as ltx-core (uv rejects two indexes for one package): CUDA 13.2 builds, which run on the
# CUDA 13.0 driver of DGX OS through minor version compatibility
[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
torchaudio = { index = "pytorch-test-cu132" }
# keep in sync with LTX_REV in build_kernels.sh
ltx-core = { git = "https://github.com/Lightricks/LTX-2", rev = "e98f6d927d83c92ef2be6aec76c8440b19306e39", subdirectory = "packages/ltx-core" }
ltx-pipelines = { git = "https://github.com/Lightricks/LTX-2", rev = "e98f6d927d83c92ef2be6aec76c8440b19306e39", subdirectory = "packages/ltx-pipelines" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-test-cu132"
url = "https://download.pytorch.org/whl/test/cu132/"
explicit = true
