[project]
name = "gb10-tool-qwen-image-edit"
version = "0.1.0"
description = "Qwen-Image-Edit-2511 worker for gb10-assets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    # the Qwen2.5-VL image processor of the text encoder needs torchvision
    "torchvision",
    "diffusers>=0.42,<0.43",
    "transformers>=5.20,<6",
    "accelerate>=1.15",
    "safetensors>=0.8",
    "pillow>=11",
]

[tool.uv]
package = false
# GB10 only: aarch64, CUDA 13
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
