[project]
name = "gb10-tool-tapnet"
version = "0.1.0"
description = "TAPNet BootsTAPIR point tracking worker for gb10-assets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "numpy>=2",
    "pillow>=11",
    # used by the vendored tapnet_torch/ (the tapnet package itself would pull in JAX)
    "einshape==1.0",
    "dm-tree==0.1.10",
]

[tool.uv]
package = false
# GB10 only: aarch64, CUDA 13
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
