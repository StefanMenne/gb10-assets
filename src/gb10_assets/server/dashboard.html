<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gb10-assets dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --border: #e3e6eb; --text: #1b1f24; --muted: #69727d; --grid: #eceef2;
  --accent: #3b82f6; --accent-soft: rgba(59, 130, 246, .16); --worker: #7c3aed; --cache: #c7cdd6;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --card: #171b21; --border: #262c35; --text: #e6e9ee; --muted: #8b95a3; --grid: #222831;
    --accent: #60a5fa; --accent-soft: rgba(96, 165, 250, .18); --worker: #a78bfa; --cache: #3a424e;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
#live { margin-left: auto; font-size: 12px; color: var(--muted); }
#live::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
#live.down::before { background: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.big { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
.big small { font-size: 15px; font-weight: 500; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.chart { position: relative; margin-top: 8px; }
.chart svg { display: block; width: 100%; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--grid); margin: 8px 0 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); }
.legend i, .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 14px; }
.stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.tool { font-weight: 600; white-space: nowrap; }
.models { font-size: 12px; color: var(--muted); max-width: 260px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-run { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.b-load { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.b-ready { background: color-mix(in srgb, var(--info) 18%, transparent); color: var(--info); }
.b-off { background: var(--grid); color: var(--muted); }
.b-bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.bar { width: 110px; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
#log-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
#log-head h2 { margin: 0; }
select { margin-left: auto; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 12px; }
#log { max-height: 420px; overflow-y: auto; }
#log td { padding: 5px 10px; font-size: 13px; }
#log td:first-child { white-space: nowrap; color: var(--muted); }
.kv { display: inline-block; margin: 1px 10px 1px 0; }
.kv b { font-weight: 500; color: var(--muted); }
.kv q { quotes: "\201C" "\201D"; }
</style>
</head>
<body>
<main>
  <header>
    <h1>gb10-assets</h1>
    <span class="muted" id="gpu-name"></span>
    <span class="muted small" id="uptime"></span>
    <span id="live">connecting…</span>
  </header>

  <div class="grid">
    <section class="card">
      <h2>GPU utilization</h2>
      <div class="row"><span class="big" id="gpu-util">–</span><span class="muted" id="gpu-sub"></span></div>
      <div class="chart" id="chart-gpu"></div>
    </section>
    <section class="card">
      <h2>System memory (unified)</h2>
      <div class="row"><span class="big" id="mem-used">–</span><span class="muted" id="mem-sub"></span></div>
      <div class="stack" id="mem-stack"></div>
      <div class="legend" id="mem-legend"></div>
      <div class="chart" id="chart-mem"></div>
    </section>
  </div>

  <div class="stats" id="stats"></div>

  <section class="card" style="margin-bottom:14px">
    <h2>Tools</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Tool</th><th>Status</th><th>Memory</th><th>Weights in page cache</th><th>Last load</th><th>Jobs 24 h</th><th>Last job</th></tr></thead>
        <tbody id="tools"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div id="log-head"><h2>Event log</h2><span class="muted small" id="log-note"></span>
      <select id="log-filter"><option value="">all tools</option></select></div>
    <div id="log" class="scroll"><table><tbody id="events"></tbody></table></div>
  </section>
</main>

<script>
"use strict";
const HISTORY_S = 3600, POLL_MS = 2000, GB = 1024 ** 3;
const TOOL_COLORS = ["#3b82f6", "#f59e0b", "#10b981", "#ef4444", "#8b5cf6", "#06b6d4", "#ec4899", "#84cc16"];
const toolColor = {};
let history = [], since = 0, latest = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const gb = b => b == null ? "–" : (b / GB).toFixed(1);
const pad = n => String(n).padStart(2, "0");
function clock(t) {
  const d = new Date(t), today = new Date().toDateString() === d.toDateString();
  return (today ? "" : `${pad(d.getDate())}.${pad(d.getMonth() + 1)}. `) + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function dur(s) {
  if (s == null) return "–";
  if (s < 60) return `${s < 10 ? s.toFixed(1) : Math.round(s)} s`;
  if (s < 3600) return `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;
  return `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min`;
}
const ago = t => dur(Math.max(0, Date.now() / 1000 - t)) + " ago";
const evTime = ev => Date.parse(ev.time) / 1000;
const dot = tool => `<span class="dot" style="background:${toolColor[tool] || "var(--muted)"}"></span>`;

// ------------------------------------------------------------------------------------------- charts
function drawChart(el, {series, max, unit, band}) {
  const w = Math.max(200, el.clientWidth), h = 150, bandH = band ? 10 : 0;
  const top = 6, bottom = h - 20 - bandH, left = 0, right = w - 38;
  const now = Date.now() / 1000, t0 = now - HISTORY_S;
  const x = t => left + (t - t0) / HISTORY_S * (right - left);
  const y = v => bottom - Math.min(v, max) / max * (bottom - top);
  let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
  for (const f of [0, .25, .5, .75, 1]) {
    const yy = y(max * f);
    svg += `<line x1="${left}" x2="${right}" y1="${yy}" y2="${yy}" stroke="${css("--grid")}"/>`;
    svg += `<text x="${right + 4}" y="${yy + 4}" font-size="10" fill="${css("--muted")}">${unit(max * f)}</text>`;
  }
  for (let m = 0; m <= 60; m += 15) {
    const xx = x(now - m * 60);
    svg += `<text x="${Math.min(xx, right - 4)}" y="${h - 4}" font-size="10" fill="${css("--muted")}" text-anchor="${m === 60 ? "start" : m ? "middle" : "end"}">${m ? `-${m} min` : "now"}</text>`;
  }
  for (const s of series) {
    let line = "", area = "", start = null, prev = null;
    const close = () => { if (start !== null) area += `L${x(prev.t)},${bottom}L${x(start)},${bottom}Z`; };
    for (const p of history) {
      const v = s.value(p);
      if (v == null) { close(); start = null; prev = null; continue; }
      const gap = prev && p.t - prev.t > POLL_MS / 1000 * 5;
      if (!prev || gap) { close(); line += `M${x(p.t)},${y(v)}`; area += `M${x(p.t)},${bottom}L${x(p.t)},${y(v)}`; start = p.t; }
      else { line += `L${x(p.t)},${y(v)}`; area += `L${x(p.t)},${y(v)}`; }
      prev = p;
    }
    close();
    if (s.fill) svg += `<path d="${area}" fill="${s.fill}" stroke="none"/>`;
    svg += `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  if (band) {
    let seg = null;
    const flush = end => { if (seg) svg += `<rect x="${x(seg.t)}" y="${bottom + 3}" width="${Math.max(1, x(end) - x(seg.t))}" height="6" rx="2" fill="${toolColor[seg.tool]}"><title>${esc(seg.tool)} loaded</title></rect>`; };
    for (const p of history) {
      if (seg && (p.tool !== seg.tool || p.t - seg.last > 10)) { flush(seg.last); seg = null; }
      if (p.tool && !seg) seg = {tool: p.tool, t: p.t};
      if (seg) seg.last = p.t;
    }
    if (seg) flush(seg.last);
  }
  svg += `<line class="cross" x1="0" x2="0" y1="${top}" y2="${bottom}" stroke="${css("--muted")}" stroke-dasharray="3 3" visibility="hidden"/></svg><div class="tip"></div>`;
  el.innerHTML = svg;
  const svgEl = el.querySelector("svg"), cross = el.querySelector(".cross"), tip = el.querySelector(".tip");
  svgEl.onmousemove = e => {
    const r = svgEl.getBoundingClientRect(), px = (e.clientX - r.left) * w / r.width;
    const t = t0 + (px - left) / (right - left) * HISTORY_S;
    let best = null;
    for (const p of history) if (!best || Math.abs(p.t - t) < Math.abs(best.t - t)) best = p;
    if (!best || Math.abs(best.t - t) > 30) { svgEl.onmouseleave(); return; }
    cross.setAttribute("x1", x(best.t)); cross.setAttribute("x2", x(best.t)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<span class="muted">${clock(best.t * 1000)}</span> ` + series.map(s => `${s.name}: <b>${s.label(best)}</b>`).join(" · ")
      + (band && best.tool ? ` · ${dot(best.tool)}${esc(best.tool)}` : "");
    tip.style.display = "block";
    tip.style.left = Math.min(Math.max(0, x(best.t) * r.width / w - tip.offsetWidth / 2), r.width - tip.offsetWidth) + "px";
    tip.style.top = "-6px";
  };
  svgEl.onmouseleave = () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
}

function drawCharts() {
  if (!latest) return;
  drawChart($("chart-gpu"), {max: 100, unit: v => `${v}%`, series: [
    {name: "GPU", color: css("--accent"), fill: css("--accent-soft"), value: p => p.gpu, label: p => p.gpu == null ? "–" : `${p.gpu} %`},
    {name: "CPU", color: css("--muted"), value: p => p.cpu, label: p => p.cpu == null ? "–" : `${p.cpu.toFixed(0)} %`},
  ]});
  const total = latest.now.mem.total;
  drawChart($("chart-mem"), {max: total, unit: v => `${Math.round(v / GB)}G`, band: true, series: [
    {name: "used", color: css("--accent"), fill: css("--accent-soft"), value: p => p.used, label: p => `${gb(p.used)} GB`},
    {name: "worker", color: css("--worker"), fill: "color-mix(in srgb, " + css("--worker") + " 22%, transparent)", value: p => p.worker || null, label: p => `${gb(p.worker)} GB`},
    {name: "page cache", color: css("--cache"), value: p => p.used + p.cache, label: p => `${gb(p.cache)} GB`},
  ]});
}

// ------------------------------------------------------------------------------------------- top
function renderTop(d) {
  const n = d.now, g = n.gpu || {}, m = n.mem;
  $("gpu-name").textContent = g.name || "no GPU readings (NVML)";
  $("uptime").textContent = `server up ${dur(Date.now() / 1000 - d.server.started)}`;
  $("gpu-util").innerHTML = g.util == null ? "–" : `${g.util}<small> %</small>`;
  $("gpu-sub").textContent = [g.temp != null && `${g.temp} °C`, g.power != null && `${g.power.toFixed(1)} W`,
    g.clock != null && `${g.clock} MHz`].filter(Boolean).join(" · ");
  $("mem-used").innerHTML = `${gb(m.used)}<small> / ${gb(m.total)} GB used</small>`;
  $("mem-sub").textContent = `${gb(m.total - m.used)} GB available`;
  const parts = [["worker", m.worker, css("--worker")], ["other processes", Math.max(0, m.used - m.worker), css("--accent")],
                 ["page cache", m.cache, css("--cache")], ["free", m.free, "transparent"]];
  $("mem-stack").innerHTML = parts.map(([k, v, c]) => `<div title="${k}: ${gb(v)} GB" style="width:${v / m.total * 100}%;background:${c}"></div>`).join("");
  $("mem-legend").innerHTML = parts.map(([k, v, c]) => `<span><i style="background:${c};${c === "transparent" ? "outline:1px solid var(--border)" : ""}"></i>${k} ${gb(v)} GB</span>`).join("");

  const disk = k => d.disks[k] ? `${gb(d.disks[k].free)} GB free` : "–";
  const {installed: di, jobs: dj} = d.disks;
  const oneDisk = di && dj && di.total === dj.total && di.free === dj.free;
  const stats = [
    ["CPU", n.cpu == null ? "–" : `${n.cpu.toFixed(0)} %`, `${n.cores} cores`],
    ["GPU temperature", g.temp == null ? "–" : `${g.temp} °C`, g.power == null ? "" : `${g.power.toFixed(1)} W`],
    ["Swap", m.swap_total ? `${gb(m.swap_used)} GB` : "off", m.swap_total ? `of ${gb(m.swap_total)} GB` : ""],
    [oneDisk ? "Disk" : "Disk installed/", disk("installed"), di ? `of ${gb(di.total)} GB` : ""],
    ...(oneDisk ? [] : [["Disk jobs/", disk("jobs"), dj ? `of ${gb(dj.total)} GB` : ""]]),
  ];
  $("stats").innerHTML = stats.map(([k, v, s]) => `<div class="card stat"><h2>${k}</h2><div class="v">${v}</div><div class="muted small">${s}</div></div>`).join("");
}

// ------------------------------------------------------------------------------------------- tools
function status(r) {
  if (r.installed === false)
    return `<span class="badge ${/another version/.test(r.problem) ? "b-bad" : "b-off"}" title="${esc(r.problem)}">${/another version/.test(r.problem) ? "outdated" : "not installed"}</span>`;
  let s;
  if (r.running) s = `<span class="badge b-run pulse">running</span> <span class="small muted">job ${esc(r.running.id)} · ${dur(Date.now() / 1000 - r.running.started)}</span>`;
  else if (r.worker && !r.worker.loaded) s = `<span class="badge b-load pulse">loading</span>`;
  else if (r.worker) s = `<span class="badge b-ready">loaded</span> <span class="small muted">idle ${dur(Date.now() / 1000 - r.worker.idle_since)}</span>`;
  else s = `<span class="muted">–</span>`;
  if (r.running && r.worker && !r.worker.loaded) s = `<span class="badge b-load pulse">loading</span> <span class="small muted">for job ${esc(r.running.id)}</span>`;
  if (r.queued) s += ` <span class="badge b-off">${r.queued} queued</span>`;
  return s;
}

function renderTools(rows) {
  $("tools").innerHTML = rows.map(r => {
    const size = r.models.reduce((a, m) => a + m.size, 0), cached = r.models.reduce((a, m) => a + m.cached, 0);
    const perModel = r.models.map(m => `${m.name}: ${gb(m.cached)} of ${gb(m.size)} GB`).join("\n");
    const w = r.worker;
    const mem = w && w.mem != null ? `<b>${gb(w.mem)} GB</b><div class="small muted">GPU ${gb(w.gpu_mem)} GB</div>` : `<span class="muted">–</span>`;
    const weights = size ? `<span title="${esc(perModel)}">${gb(cached)} / ${gb(size)} GB</span><div class="bar"><div style="width:${cached / size * 100}%"></div></div>` : `<span class="muted">–</span>`;
    const ll = r.last_load;
    const load = ll ? (ll.error ? `<span class="bad" title="${esc(ll.error)}">failed</span>` : dur(ll.seconds)) + `<div class="small muted">${ago(evTime(ll))}</div>` : `<span class="muted">–</span>`;
    const j = r.jobs_24h;
    const jobs = Object.keys(j).length ? [j.done && `<span class="ok">${j.done} done</span>`, j.failed && `<span class="bad">${j.failed} failed</span>`,
      j.cancelled && `<span class="muted">${j.cancelled} cancelled</span>`].filter(Boolean).join("<br>") : `<span class="muted">–</span>`;
    const lj = r.last_job;
    const last = lj ? `<span class="${lj.state === "done" ? "ok" : lj.state === "failed" ? "bad" : "muted"}" title="${esc(lj.error || "")}">${lj.state}</span> ${dur(lj.seconds)}<div class="small muted">${ago(evTime(lj))}</div>` : `<span class="muted">–</span>`;
    return `<tr><td><div class="tool">${dot(r.tool)}${esc(r.tool)}</div><div class="models">${esc(r.models.map(m => m.name).join(", "))}</div></td>
      <td>${status(r)}</td><td>${mem}</td><td>${weights}</td><td>${load}</td><td>${jobs}</td><td>${last}</td></tr>`;
  }).join("");
}

// ------------------------------------------------------------------------------------------- event log
function value(v) {
  if (typeof v === "string") return `<q>${esc(v)}</q>`;
  if (Array.isArray(v)) return "[" + v.map(value).join(", ") + "]";
  return esc(JSON.stringify(v));
}
const kv = (k, v) => `<span class="kv"><b>${esc(k)}</b> ${v}</span>`;

function details(ev) {
  switch (ev.kind) {
    case "job_start":
      return kv("job", `<span class="mono">${esc(ev.job)}</span>`) + (ev.waited_s >= 1 ? kv("waited", dur(ev.waited_s)) : "")
        + Object.entries(ev.params || {}).map(([k, v]) => kv(k, value(v))).join("");
    case "job_end": {
      const outs = ev.outputs || [];
      return kv("job", `<span class="mono">${esc(ev.job)}</span>`)
        + kv("result", `<span class="${ev.state === "done" ? "ok" : ev.state === "failed" ? "bad" : "muted"}">${ev.state}</span> after ${dur(ev.seconds)}`)
        + (outs.length ? kv("outputs", esc(outs.slice(0, 6).join(", ")) + (outs.length > 6 ? ` +${outs.length - 6}` : "")) : "")
        + (ev.error && ev.state !== "cancelled" ? kv("error", `<span class="bad">${esc(ev.error)}</span>`) : "");
    }
    case "load_start":
      return kv("weights", esc((ev.models || []).join(", ") || "–")) + kv("available", `${ev.mem_free_gb} GB`);
    case "load_end":
      return ev.error ? kv("error", `<span class="bad">${esc(ev.error)}</span>`)
        : kv("loaded in", dur(ev.seconds)) + kv("available after", `${ev.mem_free_gb} GB`);
    case "unload":
      return kv("reason", esc(ev.reason));
  }
  return "";
}
const KIND = {job_start: ["job start", ""], job_end: ["job end", ""], load_start: ["loading weights", "warn"],
              load_end: ["weights loaded", "warn"], unload: ["weights released", "muted"]};

function renderEvents(events) {
  const filter = $("log-filter").value;
  const shown = events.filter(e => KIND[e.kind] && (!filter || e.tool === filter)).reverse();
  $("events").innerHTML = shown.map(ev => {
    const [label, cls] = KIND[ev.kind];
    const kindCls = ev.kind === "job_end" ? (ev.state === "done" ? "ok" : ev.state === "failed" ? "bad" : "muted")
      : ev.kind === "load_end" && ev.error ? "bad" : cls;
    return `<tr><td>${clock(Date.parse(ev.time))}</td><td class="tool">${dot(ev.tool)}${esc(ev.tool)}</td>
      <td class="${kindCls}" style="white-space:nowrap">${label}</td><td>${details(ev)}</td></tr>`;
  }).join("") || `<tr><td class="muted">no events yet</td></tr>`;
}

// ------------------------------------------------------------------------------------------- polling
let lastData = null;
async function poll() {
  try {
    const r = await fetch(`dashboard/data?since=${since}`, {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    d.tools.forEach((t, i) => { toolColor[t.tool] = TOOL_COLORS[i % TOOL_COLORS.length]; });
    if ($("log-filter").options.length === 1)
      d.tools.forEach(t => $("log-filter").add(new Option(t.tool, t.tool)));
    history.push(...d.history);
    if (d.history.length) since = d.history[d.history.length - 1].t;
    const cutoff = Date.now() / 1000 - HISTORY_S;
    while (history.length && history[0].t < cutoff) history.shift();
    latest = lastData = d;
    if (d.now && d.now.mem) { renderTop(d); drawCharts(); }
    renderTools(d.tools);
    renderEvents(d.events);
    $("log-note").textContent = d.server.details ? "" : "job parameters hidden (DASHBOARD_DETAILS=0)";
    $("live").textContent = `updated ${clock(Date.now())}`;
    $("live").classList.remove("down");
  } catch (e) {
    $("live").textContent = "server not reachable";
    $("live").classList.add("down");
  }
  setTimeout(poll, POLL_MS);
}
$("log-filter").onchange = () => lastData && renderEvents(lastData.events);
window.addEventListener("resize", drawCharts);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawCharts);
poll();
</script>
</body>
</html>
