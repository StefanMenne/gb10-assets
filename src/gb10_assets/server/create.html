<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gb10-assets image studio</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --border: #e3e6eb; --text: #1b1f24; --muted: #69727d; --grid: #eceef2;
  --accent: #3b82f6; --accent-soft: rgba(59, 130, 246, .16); --worker: #7c3aed;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --card: #171b21; --border: #262c35; --text: #e6e9ee; --muted: #8b95a3; --grid: #222831;
    --accent: #60a5fa; --accent-soft: rgba(96, 165, 250, .18); --worker: #a78bfa;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
a { color: var(--accent); }
header a { font-size: 13px; }
header a.first { margin-left: auto; }
.muted { color: var(--muted); } .small { font-size: 12px; } .bad { color: var(--bad); } .ok { color: var(--ok); } .warn { color: var(--warn); }
.layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
form.card { position: sticky; top: 16px; display: grid; gap: 12px; }
@media (max-width: 860px) { form.card { position: static; } }
label.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
textarea, input, select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 14px; font-weight: 400; }
textarea { min-height: 110px; resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--grid); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 6px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
.tabs button[aria-selected=true] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
#drop { border: 1.5px dashed var(--border); border-radius: 8px; padding: 10px; text-align: center; color: var(--muted); font-size: 13px; cursor: pointer; }
#drop.over { border-color: var(--accent); background: var(--accent-soft); }
#inputs { display: flex; flex-wrap: wrap; gap: 8px; }
#inputs:empty { display: none; }
.thumb { position: relative; width: 76px; height: 76px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); background: var(--grid); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 20px; padding: 0; cursor: pointer; }
.thumb span { position: absolute; left: 3px; bottom: 3px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; border-radius: 4px; padding: 0 4px; }
.btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn:hover { background: var(--grid); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 8px 12px; font-size: 14px; justify-content: center; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
#status { display: none; align-items: center; gap: 10px; font-size: 13px; }
#status.on { display: flex; }
#status .spin { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
#status .btn { margin-left: auto; }
#error { display: none; font-size: 13px; color: var(--bad); white-space: pre-wrap; word-break: break-word; }
#error.on { display: block; }
#results-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
#results-head h2 { margin: 0; }
#results-head .btn { margin-left: auto; }
#results { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.res { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.res img { display: block; width: 100%; height: auto; background: var(--grid); cursor: zoom-in; }
.res .meta { padding: 8px 10px 0; font-size: 12px; color: var(--muted); }
.res .meta b { color: var(--text); font-weight: 600; }
.res .prompt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.res .actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; }
.empty { grid-column: 1 / -1; color: var(--muted); padding: 40px 0; text-align: center; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; cursor: zoom-out; }
#zoom.on { display: flex; }
#zoom img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Image studio</h1>
    <span class="muted small">gb10-assets</span>
    <a href="video" class="first">Video studio</a>
    <a href="dashboard">← Dashboard</a>
  </header>

  <div class="layout">
    <form class="card" id="form" autocomplete="off">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-generate" aria-selected="true">Generate</button>
        <button type="button" role="tab" id="tab-edit" aria-selected="false">Edit</button>
      </div>
      <div class="hint" id="mode-hint"></div>

      <label class="f">Prompt
        <textarea id="prompt" required maxlength="4000"></textarea>
      </label>

      <div class="f" style="display:grid;gap:6px" id="inputs-box">
        <label class="f" for="file" id="inputs-label"></label>
        <div id="drop" tabindex="0">Drop images here, paste, or click to choose</div>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <div id="inputs"></div>
      </div>

      <label class="f">Size
        <select id="preset"></select>
      </label>
      <div class="pair" id="custom-size">
        <label class="f">Width <input type="number" id="width" min="256" max="2048" step="16"></label>
        <label class="f">Height <input type="number" id="height" min="256" max="2048" step="16"></label>
      </div>

      <div class="pair">
        <label class="f">Variants <input type="number" id="count" min="1" max="16" value="1"></label>
        <label class="f">Seed <input type="number" id="seed" min="0" max="4294967295" placeholder="random"></label>
      </div>

      <button type="submit" class="btn primary" id="submit">Generate</button>
      <div id="status"><div class="spin"></div><span id="status-text"></span><button type="button" class="btn" id="cancel">Cancel</button></div>
      <div id="error"></div>
    </form>

    <section>
      <div id="results-head"><h2>Results</h2><span class="small muted" id="results-note"></span>
        <button type="button" class="btn" id="clear" hidden>Clear</button></div>
      <div id="results"><div class="empty">Your images appear here. They stay in this tab only, download the ones you want to keep.</div></div>
    </section>
  </div>
</main>
<div id="zoom"><img alt=""></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const MODES = {
  generate: {tool: "qwen-image", files: null, min: 0, max: 0, submit: "Generate", label: "", size: "1328x1328",
    presets: [[1328, 1328], [1664, 928], [928, 1664], [1472, 1104], [1104, 1472], [1584, 1056], [1056, 1584]],
    hint: "Qwen-Image-2512: text to image, also legible text (put it in quotes) and photorealism. To restyle or recolor an image use Edit."},
  edit: {tool: "qwen-image-edit", files: "images", min: 1, max: 3, submit: "Edit",
    label: "Images to edit (1 to 3)",
    hint: "Qwen-Image-Edit: change objects, text, style or background, or combine up to three images (\"the person from image 1 holds the cup from image 2\")."},
};
const PRESETS = [[1024, 1024], [1536, 1024], [1024, 1536], [1344, 768], [768, 1344], [768, 1024], [1024, 768], [512, 512], [2048, 2048]];
const SETTINGS_KEY = "gb10-assets-create", TOKEN_KEY = "gb10-assets-token";

let mode = "generate", inputs = [], results = [], job = null, inputSeq = 0;

// ------------------------------------------------------------------------------------------- storage
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function storedToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } }
function storeToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }

// a request with the token (GB10_ASSETS_TOKEN); asks for it on 401, the browser keeps it (shared with the dashboard)
async function api(method, path, {body, blob, step} = {}) {
  for (let wrong = false, tries = 0; ;) {
    const token = storedToken();
    const headers = token ? {Authorization: `Bearer ${token}`} : {};
    let r;
    try {
      r = await fetch(path, {method, headers, body, cache: "no-store"});
    } catch (err) {
      // no answer from the server (network, standby, server restart); reading is safe to repeat, for ~2 min
      if (method === "GET" && ++tries <= 40) { await sleep(tries === 1 ? 0 : 3000); continue; }
      throw new Error(`${step || method + " " + path}: no answer from the server (${err.message}). `
        + "Check that the GB10 is reachable, e.g. the dashboard; a job that was already submitted keeps running there.");
    }
    if (r.status === 401) {
      const t = prompt((wrong || token ? "Wrong token. " : "") + "Token (GB10_ASSETS_TOKEN in the server's .env):");
      if (!t) throw new Error("no token given");
      storeToken(t.trim()); wrong = true; continue;
    }
    if (!r.ok) throw new Error(await errorText(r));
    return r.status === 204 ? null : blob ? r.blob() : r.json();
  }
}
async function errorText(r) {
  const text = await r.text();
  try {
    const d = JSON.parse(text).detail;
    if (Array.isArray(d)) return d.map(e => `${(e.loc || []).filter(x => x !== "body").join(".")}: ${e.msg}`).join("\n");
    if (d) return String(d);
  } catch {}
  return `${r.status} ${text}`;
}

// ------------------------------------------------------------------------------------------- form
function setMode(m) {
  mode = m;
  const cfg = MODES[m];
  for (const k in MODES) $(`tab-${k}`).setAttribute("aria-selected", m === k);
  $("inputs-box").hidden = !cfg.max;
  $("mode-hint").textContent = cfg.hint;
  $("inputs-label").textContent = cfg.label;
  $("prompt").placeholder = m === "generate"
    ? "A hand-painted wooden sign on a cafe door reading \"Fresh Coffee\", morning light, photo"
    : "Replace the background with a sunny beach";
  if (!job) $("submit").textContent = cfg.submit;
  const keep = $("preset").value;
  $("preset").innerHTML = (m === "edit" ? `<option value="auto">Auto (first image's aspect ratio, ~1 MP)</option>` : "")
    + (cfg.presets || PRESETS).map(([w, h]) => `<option value="${w}x${h}">${w} × ${h}${w === h ? " square" : w > h ? " landscape" : " portrait"}</option>`).join("")
    + `<option value="custom">Custom…</option>`;
  $("preset").value = [...$("preset").options].some(o => o.value === keep) ? keep : m === "edit" ? "auto" : cfg.size || "1024x1024";
  syncSize();
  renderInputs();
  saveSettings();
}
function syncSize() {
  const v = $("preset").value;
  $("custom-size").hidden = v !== "custom";
  if (v !== "custom" && v !== "auto") [$("width").value, $("height").value] = v.split("x");
}
function snap(el) {
  if (el.value === "") return;
  el.value = Math.min(2048, Math.max(256, Math.round(Number(el.value) / 16) * 16));
}
function saveSettings() {
  save(SETTINGS_KEY, {mode, prompt: $("prompt").value, preset: $("preset").value, width: $("width").value,
                      height: $("height").value, count: $("count").value});
}

// ------------------------------------------------------------------------------------------- input images
// read at once: a File is only a reference, and the upload fails if the file changes or moves before it
async function addFiles(files) {
  const max = MODES[mode].max;
  if (!max) return;
  showError("");
  for (const f of [...files]) {
    if (!f.type.startsWith("image/")) { showError(`${f.name} is not an image.`); continue; }
    if (inputs.length >= max) { showError(`At most ${max} images in this mode.`); break; }
    try {
      addInput(new Blob([await f.arrayBuffer()], {type: f.type}));
    } catch (err) {
      showError(`Could not read ${f.name}: ${err.message}`);
    }
    renderInputs();
  }
}
function addInput(blob) {
  const ext = ({"image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif"})[blob.type] || "png";
  inputs.push({blob, name: `input_${++inputSeq}.${ext}`, url: URL.createObjectURL(blob)});
}
function renderInputs() {
  $("inputs").innerHTML = inputs.map((inp, i) => `<div class="thumb"><img src="${inp.url}" alt="input ${i + 1}">
    <span>${i + 1}</span><button type="button" data-i="${i}" title="Remove" aria-label="Remove image ${i + 1}">×</button></div>`).join("");
  const over = inputs.length > MODES[mode].max;
  $("drop").textContent = over ? `Only ${MODES[mode].max} images in this mode, remove some`
    : "Drop images here, paste, or click to choose";
  $("drop").classList.toggle("bad", over);
}
$("inputs").onclick = e => {
  const i = e.target.dataset.i;
  if (i === undefined) return;
  URL.revokeObjectURL(inputs[i].url);
  inputs.splice(Number(i), 1);
  renderInputs();
};
$("drop").onclick = () => $("file").click();
$("drop").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
$("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
for (const ev of ["dragenter", "dragover"]) $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); });
for (const ev of ["dragleave", "drop"]) $("drop").addEventListener(ev, () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", e => { e.preventDefault(); addFiles(e.dataTransfer.files); });
document.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); addFiles(files); }
});

// ------------------------------------------------------------------------------------------- job
function showError(msg) { $("error").textContent = msg || ""; $("error").classList.toggle("on", !!msg); }
function setStatus(text) {
  $("status").classList.toggle("on", text != null);
  $("status-text").textContent = text || "";
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dur = s => s < 60 ? `${Math.round(s)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;

$("form").onsubmit = async e => {
  e.preventDefault();
  if (job) return;
  showError("");
  const cfg = MODES[mode];
  const prompt = $("prompt").value.trim();
  if (!prompt) return showError("Enter a prompt.");
  if (inputs.length < cfg.min) return showError("Add at least one image to edit.");
  if (cfg.files && inputs.length > cfg.max) return showError(`At most ${cfg.max} images in this mode.`);
  const params = {prompt, count: Number($("count").value) || 1};
  if (cfg.files) params[cfg.files] = inputs.map(i => i.name);
  if ($("seed").value !== "") params.seed = Number($("seed").value);
  if ($("preset").value !== "auto") {
    snap($("width")); snap($("height"));
    params.width = Number($("width").value); params.height = Number($("height").value);
  }
  const body = new FormData();
  body.append("request", JSON.stringify({tool: cfg.tool, params}));
  if (cfg.files) for (const inp of inputs) body.append("files", inp.blob, inp.name);
  saveSettings();

  const snapshot = {mode, prompt, preset: $("preset").value, w: params.width, h: params.height};
  $("submit").disabled = true;
  setStatus("Submitting…");
  try {
    const info = await api("POST", "jobs", {body, step: "Submitting the job"});
    job = {id: info.id, started: Date.now()};
    $("submit").textContent = "Running…";
    await follow(job, snapshot);
  } catch (err) {
    showError(job?.cancelled ? "Cancelled." : err.message);
  } finally {
    job = null;
    setStatus(null);
    $("submit").disabled = false;
    $("submit").textContent = MODES[mode].submit;
  }
};

async function follow(j, snapshot) {
  for (;;) {
    const info = await api("GET", `jobs/${j.id}`, {step: "Checking the job"});
    if (j.cancelled) throw new Error("Cancelled.");
    const t = (Date.now() - j.started) / 1000;
    if (info.state === "queued") {
      setStatus(info.queue_position ? `Waiting: ${info.queue_position} job${info.queue_position > 1 ? "s" : ""} ahead · ${dur(t)}` : `Starting… · ${dur(t)}`);
    } else if (info.state === "running") {
      setStatus(`${await workerPhase(snapshot.mode)} · ${dur(t)}`);
    } else if (info.state === "done") {
      setStatus("Downloading results…");
      const names = info.outputs.filter(n => n !== "sheet.png");
      const added = [];
      for (const name of names) {
        const blob = await api("GET", `jobs/${j.id}/files/${encodeURIComponent(name)}`, {blob: true, step: `Downloading ${name}`});
        const seed = (name.match(/_(\d+)\.\w+$/) || [])[1];
        added.push({name, blob, url: URL.createObjectURL(blob), seed, ...snapshot, seconds: t});
      }
      api("DELETE", `jobs/${j.id}`).catch(() => {});  // results are in this tab now
      for (const r of added) {
        const img = await createImageBitmap(r.blob).catch(() => null);
        if (img) { r.width = img.width; r.height = img.height; img.close(); }
      }
      results.unshift(...added);
      renderResults();
      return;
    } else {
      api("DELETE", `jobs/${j.id}`).catch(() => {});
      throw new Error(info.state === "cancelled" ? "Cancelled." : `Failed: ${info.error || "unknown error"}`
        + (info.log_tail?.length ? "\n\n" + info.log_tail.slice(-6).join("\n") : ""));
    }
    await sleep(1000);
  }
}

// running: loading the model or computing, from the dashboard data (no token needed)
async function workerPhase(m) {
  try {
    const r = await fetch(`dashboard/data?since=${Date.now() / 1000}`, {cache: "no-store"});
    const w = (await r.json()).now.worker;
    if (w && w.loaded == null) return `Loading ${w.tool} model`;
  } catch {}
  return m === "edit" ? "Editing" : "Generating";
}

$("cancel").onclick = async () => {
  if (!job) return;
  job.cancelled = true;
  try { await api("DELETE", `jobs/${job.id}`); } catch (err) { showError(err.message); }
};

// ------------------------------------------------------------------------------------------- results
function renderResults() {
  $("clear").hidden = !results.length;
  $("results-note").textContent = results.length ? `${results.length} image${results.length > 1 ? "s" : ""}, kept in this tab only` : "";
  if (!results.length) {
    $("results").innerHTML = `<div class="empty">Your images appear here. They stay in this tab only, download the ones you want to keep.</div>`;
    return;
  }
  $("results").innerHTML = results.map((r, i) => `<div class="res">
    <img src="${r.url}" alt="" data-zoom="${i}">
    <div class="meta"><b>${({generate: "Generate", edit: "Edit"})[r.mode]}</b>${r.seed ? ` · seed ${r.seed}` : ""}${r.width ? ` · ${r.width} × ${r.height}` : ""} · ${dur(r.seconds)}
      <div class="prompt" title="${esc(r.prompt)}">${esc(r.prompt)}</div></div>
    <div class="actions">
      <a class="btn" href="${r.url}" download="${esc(fileName(r))}">Download</a>
      ${r.seed ? `<button type="button" class="btn" data-act="seed" data-i="${i}" title="Prompt, size and seed of this image back into the form (input images are not restored)">Reuse</button>` : ""}
      <button type="button" class="btn" data-act="edit" data-i="${i}" title="Edit this image">Edit this</button>
    </div></div>`).join("");
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]); }
function fileName(r) {
  const slug = r.prompt.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "image";
  return `${slug}${r.seed ? "-" + r.seed : ""}.png`;
}
$("results").onclick = e => {
  const zoom = e.target.dataset.zoom;
  if (zoom !== undefined) { $("zoom").querySelector("img").src = results[zoom].url; $("zoom").classList.add("on"); return; }
  const r = results[e.target.dataset.i];
  if (!r) return;
  if (e.target.dataset.act === "seed") {
    if (r.mode !== mode) setMode(r.mode);
    $("prompt").value = r.prompt;
    $("seed").value = r.seed;
    $("count").value = 1;
    $("preset").value = r.preset;
    if (r.preset === "custom") { $("width").value = r.w; $("height").value = r.h; }
    syncSize();
    saveSettings();
  } else if (e.target.dataset.act === "edit") {
    if (mode !== "edit") setMode("edit");
    if (inputs.length >= MODES.edit.max) return showError(`At most ${MODES.edit.max} images: remove one first.`);
    addInput(r.blob);
    renderInputs();
    $("preset").value = "auto";
    $("count").value = 1;
    syncSize();
    $("prompt").value = "";
    $("prompt").focus();
  }
  window.scrollTo({top: 0, behavior: "smooth"});
};
$("zoom").onclick = () => $("zoom").classList.remove("on");
document.addEventListener("keydown", e => { if (e.key === "Escape") $("zoom").classList.remove("on"); });
$("clear").onclick = () => {
  if (!confirm("Remove all results from this page? Download the ones you want to keep first.")) return;
  results.forEach(r => URL.revokeObjectURL(r.url));
  results = [];
  renderResults();
};
window.addEventListener("beforeunload", e => { if (results.length || job) e.preventDefault(); });

// ------------------------------------------------------------------------------------------- start
$("tab-generate").onclick = () => setMode("generate");
$("tab-edit").onclick = () => setMode("edit");
$("preset").onchange = () => { syncSize(); saveSettings(); };
for (const id of ["width", "height"]) $(id).onchange = () => { snap($(id)); saveSettings(); };
for (const id of ["prompt", "count"]) $(id).addEventListener("change", saveSettings);
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit(); });

const saved = load(SETTINGS_KEY, {});
$("prompt").value = saved.prompt || "";
$("count").value = saved.count || 1;
setMode(saved.mode in MODES ? saved.mode : "generate");
if (saved.preset && [...$("preset").options].some(o => o.value === saved.preset)) $("preset").value = saved.preset;
if (saved.preset === "custom") { $("width").value = saved.width || 1024; $("height").value = saved.height || 1024; }
syncSize();
</script>
</body>
</html>
